version: "3"

dotenv:
  - .env

vars:
  BIN_DIR: bin
  APP_NAME: artshare
  APP_PATH: ./cmd/artshare
  MIGRATIONS_DIR: migrations
  COMPOSE_FILE: ci/docker-compose.yml
  MIGRATE_CMD: go run -tags 'postgres'
    github.com/golang-migrate/migrate/v4/cmd/migrate@latest

tasks:
  build:
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.APP_NAME}} {{.APP_PATH}}

  check:
    cmds:
      - task: lint
      - task: test

  clean:
    cmds:
      - rm -rf {{.BIN_DIR}}/*

  deps:
    cmds:
      - go install -tags 'postgres'
        github.com/golang-migrate/migrate/v4/cmd/migrate@latest

  lint:
    cmds:
      - golangci-lint run --fix --timeout 5m ./...

  migrate-postgres:
    cmds:
      - '{{.MIGRATE_CMD}} -database "$DATABASE_URL" -path {{.MIGRATIONS_DIR}}
        up'

  migrate-up-postgres:
    cmds:
      - '{{.MIGRATE_CMD}} -database "$DATABASE_URL" -path {{.MIGRATIONS_DIR}}
        up 1'

  migrate-down-postgres:
    cmds:
      - '{{.MIGRATE_CMD}} -database "$DATABASE_URL" -path {{.MIGRATIONS_DIR}}
        down 1'

  run:
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}}

  test:
    cmds:
      - go test ./...

  start-cluster:
    desc: Start Postgres + application via docker-compose
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build postgres migrate app

  stop-cluster:
    desc: Stop and remove all compose services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  logs-cluster:
    desc: Tail logs from the running cluster
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f

  test-integration:
    desc: Run integration tests in a container against the running app
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} --profile test up
        --build --abort-on-container-exit --exit-code-from integration-tests
        integration-tests
      - docker compose -f {{.COMPOSE_FILE}} --profile test down
